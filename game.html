<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taha Aslani | Game</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/sweetalert2@11.15.10/dist/sweetalert2.min.css"
    />
    <link rel="stylesheet" href="styles/game.css" />
    <link rel="stylesheet" href="styles/global.css" />
  </head>
  <body>
    <span id="loader"></span>
    <h4 id="error">
      There was an error! Please check your connection and
      <a href="/game.html">try again</a>
    </h4>
    <div id="container">
      <div class="header">
        <div>
          <p>Question No:</p>
          <span id="question-number">1</span>
        </div>
        <div>
          <p>Score:</p>
          <span id="score">0</span>
        </div>
      </div>
      <div id="question-box">
        <h3 id="question-text">Question?</h3>
        <button class="answer-text">1</button>
        <button class="answer-text">2</button>
        <button class="answer-text">3</button>
        <button class="answer-text">4</button>
      </div>
      <button id="finish-button">Finish</button>
      <button id="next-button">Next</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.15.10/dist/sweetalert2.all.min.js"></script>
    <script src="scripts/game.js" type="module"></script>
    <script src="scripts/helper.js" type="module"></script>
  </body>
</html>
